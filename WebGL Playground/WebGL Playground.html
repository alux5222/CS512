  <!-- Vertex Shader -->
   <script id="vertex-shader" type="x-shader/x-vertex">#version 300 es
in vec3 aPosition;
in vec3 aColor;

uniform highp float uTime;

out vec3 vColor;
out vec2 v_uv;

void main() {

    //gl_Position = vec4(aPosition, 1.0);
    //vColor = aColor;
    
    //Modify position
    vec3 position = aPosition;

    position.y += sin(position.x * 3.0 + uTime) * 0.05;

    gl_Position = vec4(position, 1.7);
    
    //Pass color to fragment shader afterposition changed
    vColor = aColor;
    //Pass UV coordinates
    v_uv = position.xy * 0.5 + 0.5;
}

</script>

  <!-- Fragment Shader -->
   <script id="fragment-shader" type="x-shader/x-fragment">#version 300 es
precision mediump float;

in vec3 vColor;
in vec2 v_uv;

out vec4 fragColor;

uniform highp float uTime;

//uniform float uTime; 
//This did not work, because uTime 
//exists in both shaders, but WebGL is seeing 
//different precision for the uniform in each shader.

void main() {
    //fragColor = vec4(vColor, 1.0);

    //Distance from center
    float dist = distance(v_uv, vec2(0.5, 0.5));

    //float rings = sin(dist * 20.0 - uTime * 3.0);
    //rings = rings * 0.5 + 0.5;

    //Create the ring pattern (moving outwards)
     float rings = sin(dist * 20.0 - uTime * 3.0) * 0.5 + 0.5;

    //Animate color based on time (Fixed: normalized to 0-1 range)
    //We add different offsets (+0.0, +2.0, +4.0) to make R, G, and B differen
    float r = sin(uTime * 2.0 + 0.0);
    float g = sin(uTime * 2.0 + 2.0); 
    float b = sin(uTime * 2.0 + 4.0); 

    //Mix the animated rainbow color with the original vertex color
    //When rings = 1.0 (peak), show the rainbow colors
    //When rings = 0.0 (trough), show the original Red/Green/Blue triangle corners
    vec3 animatedColor = vec3(r, g, b);
    vec3 finalColor = mix(vColor, animatedColor, rings);

    fragColor = vec4(finalColor, 1.0);
}
</script>

  <script>
        function createShader(gl, type, source) {
      let shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    function createProgram(gl, vsSource, fsSource) {
      let vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
      let fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
      let prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(prog));
      }
      return prog;
    }


    // --- WebGL init ---
    const canvas = document.getElementById("glcanvas");
    // const gl = canvas.getContext("webgl2");
    const gl = canvas.getContext("webgl2", { premultipliedAlpha: false });
    if (!gl) alert("WebGL2 not supported");

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);


    const vsEditor = document.getElementById("vsEditor");
    const fsEditor = document.getElementById("fsEditor");
    vsEditor.value = document.getElementById("vertex-shader").textContent;
    fsEditor.value = document.getElementById("fragment-shader").textContent;

    let program, posLoc, colorLoc, timeLoc;
    let posBuffer, colorBuffer;

    // --- Buffers ---
    function initBuffers() {
      posBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

      colorBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, colors, gl.STATIC_DRAW);
    }

    initBuffers();
function initShaderProgram() {
    try {
        const newProgram = createProgram(
            gl,
            vsEditor.value,
            fsEditor.value
        );

        // Only replace the program if compilation succeeded
        program = newProgram;

        gl.useProgram(program);

        posLoc = gl.getAttribLocation(program, "aPosition");
        colorLoc = gl.getAttribLocation(program, "aColor");
        timeLoc = gl.getUniformLocation(program, "uTime");

        console.log("Shader compiled successfully");

    } catch (e) {
        console.error("Shader error:", e);
    }
}

    // function initShaderProgram() {
    //   try {
    //     program = createProgram(gl, vsEditor.value, fsEditor.value);
    //     gl.useProgram(program);
    //     posLoc = gl.getAttribLocation(program, "aPosition");
    //     colorLoc = gl.getAttribLocation(program, "aColor");
    //     timeLoc = gl.getUniformLocation(program, "uTime");
    //   } catch (e) { console.error(e); }
    // }

    initShaderProgram();

    //hot compile when any input in the playground text area
    vsEditor.onkeyup = initShaderProgram;
    fsEditor.onkeyup = initShaderProgram;

    let startTime = Date.now();

    function render() {

    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    if (!program) return;

    gl.useProgram(program);

    // Position
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(
        posLoc,
        3,
        gl.FLOAT,
        false,
        0,
        0
    );

    // Color
    gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
    gl.enableVertexAttribArray(colorLoc);
    gl.vertexAttribPointer(
        colorLoc,
        3,
        gl.FLOAT,
        false,
        0,
        0
    );

    // Time
    const deltaTime = Date.now() - startTime;

    if (timeLoc) {
        gl.uniform1f(timeLoc, deltaTime / 1000.0);
    }

    gl.drawArrays(gl.TRIANGLES, 0, 3);
}
